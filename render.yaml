services:
  - type: web
    name: kivi-memory-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install uv && uv sync --project backend --locked
    startCommand: uv run --project backend python -m kivi_memory.cli migrate && uv run --project backend python -m kivi_memory.cli serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: TRUSTED_ORIGINS
        value: "http://127.0.0.1:8000,http://localhost:8000,https://*.vercel.app"
      - key: SARVAM_API_KEY
        sync: false
